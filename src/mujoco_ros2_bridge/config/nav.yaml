# A* 全局规划 + DWA 局部规划参数
# 修改后重启对应节点即可，不需要改代码。

astar_planner:
  ros__parameters:
    lethal_threshold: 98      # costmap_node 发布前已缩放到 0~100，>=98 为不可通行
    cost_weight: 0.10         # 0.02 → 0.10，让路径走开口中心而不是贴边
    smooth_iterations: 120    # 80 → 120，路径更顺
    smooth_alpha: 0.55        # 平滑步长
    replan_period: 3.0        # 定期重规划周期 [s]

dwa_planner:
  ros__parameters:
    # ---- 视界 ----
    horizon: 1.5              # 前向模拟时长 [s]
    sim_dt: 0.05              # 积分步长 [s]
    control_rate: 10.0        # 重规划频率 [Hz]
    # ---- 约束（必须与 MPC 模型对齐）----
    v_max: 1.2
    v_min: 0.0                # 不主动倒车：只允许前进/侧移/停车
    w_max: 1.5
    a_max: 1.0                # 线加速度上限 [m/s^2]
    alpha_max: 2.0            # 角加速度上限 [rad/s^2]
    # ---- 采样数 ----
    n_vx: 7
    n_vy: 7
    n_wz: 5
    # ---- 打分权重 ----
    w_goal: 1.0               # 朝目标
    w_clear: 0.9              # 离障碍（限制侧移到边界）
    w_vel: 1.5                # 速度奖励（DWA 接管时更愿意动，而不是停）
    w_approach: 1.0           # 紧急时惩罚朝障碍方向的速度分量
    w_lateral: 0.8            # 紧急时奖励侧向速度，倾向纯侧移
    w_stop: 0.5               # 零速惩罚，v < 0.1 m/s 的轨迹直接扣分
    w_wz: 0.6                 # 原地自转惩罚（减少自转采样后仍保留）
    w_path_max: 1.5           # 无动态障碍时贴 A* 路径
    w_path_min: 0.4           # 圆柱靠近时不要完全脱离 A*，限制大幅侧移
    # ---- 其他 ----
    lookahead: 2.0            # 沿全局路径前视距离 [m]
    lethal_threshold: 98
    # ---- 动态障碍 ----
    dynamic_safe_radius: 1.0  # 硬碰撞边界（前视段仍安全时不会提前切 DWA）
    dynamic_warn_radius: 4.8  # 软代价范围上限
    dynamic_warn_gain: 3.0    # 距离兜底的避让时间 T
    dynamic_warn_min: 3.0     # 最小软代价范围：跟车时也要保持距离
    dynamic_warn_accel_weight: 0.5 # 加速度项权重（0=只看速度）
    dynamic_ttc: 2.5          # T_prepare：TTC 小于 2.5 s 开始逐渐加权
    w_dynamic: 1.3            # 预警权重
    dynamic_curve_k: 9.0      # 对数代价曲线陡度
    dynamic_weight_power: 0.5 # sqrt 映射：把动态权重往远处扩
    blend_alpha: 0.25         # blend 上升低通系数（越小越平滑）
    blend_release_alpha: 0.08 # blend 下降更慢，DWA 接管后不急着回 A*
    dwa_switch_blend: 0.2     # TTC 约 2.0 s 时从 A* 直通切到 DWA
